[options]
; Config base horneada en la imagen (ver Dockerfile). Los datos de la base
; (host/usuario/contraseña) los toma de las variables de entorno HOST/USER/PASSWORD
; que define docker-compose.yml, así no quedan secretos en la imagen.
addons_path = /mnt/extra-addons,/mnt/adhoc
data_dir = /var/lib/odoo

; --- Seguridad ---
; Cambiá este master password antes de producción (o sobre-escribí el archivo
; con un "file mount" en Coolify). Con list_db=False el gestor de bases queda inaccesible.
admin_passwd = CAMBIAME_master_password
list_db = False
dbfilter = ^comercial$

; --- Proxy inverso (Coolify/Traefik + Cloudflare delante) ---
proxy_mode = True

; --- Rendimiento ---
; workers = 0 (modo threaded): el websocket/longpolling va por el MISMO puerto 8069,
; así Coolify rutea un solo puerto (simple). Si más adelante querés multiproceso,
; subí workers y agregá una ruta para /websocket -> 8072.
workers = 0
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; --- Logs a stdout ---
log_level = info
