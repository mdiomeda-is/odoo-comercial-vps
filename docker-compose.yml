# ============================================================================
#  Odoo 19 Community + PostgreSQL 16  ·  para desplegar en COOLIFY
#  Coolify aporta el reverse proxy (Traefik) + SSL automático; por eso acá
#  NO hay servicio Traefik ni puertos 80/443. En Coolify asignás el dominio al
#  servicio 'odoo' (puerto 8069) y él se encarga del HTTPS.
# ============================================================================
services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  odoo:
    build:
      context: .
      args:
        ODOO_VERSION: "19.0"
    image: odoo-comercial-vps:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La imagen oficial de Odoo usa estas variables para conectar a la base:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      # --- Las lee scripts/preconfigure.py (empresa + admin + idioma + URL base) ---
      ODOO_DB_NAME: ${ODOO_DB_NAME:-comercial}
      ODOO_ADMIN_LOGIN: ${ODOO_ADMIN_LOGIN}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      ODOO_BASE_URL: ${ODOO_BASE_URL}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES}
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_VAT: ${COMPANY_VAT}
      COMPANY_STREET: ${COMPANY_STREET}
      COMPANY_CITY: ${COMPANY_CITY}
      COMPANY_ZIP: ${COMPANY_ZIP}
      COMPANY_STATE: ${COMPANY_STATE}
      COMPANY_COUNTRY_CODE: ${COMPANY_COUNTRY_CODE:-AR}
      COMPANY_PHONE: ${COMPANY_PHONE}
      COMPANY_EMAIL: ${COMPANY_EMAIL}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE}
      COMPANY_CURRENCY: ${COMPANY_CURRENCY:-ARS}
      COMPANY_LANG: ${COMPANY_LANG:-es_AR}
      COMPANY_TZ: ${COMPANY_TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - odoo-data:/var/lib/odoo
    expose:
      - "8069"
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
